
name: Build and Release APK

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APKs
        run: flutter build apk --release --no-tree-shake-icons --split-per-abi

      - name: Rename APKs with project name
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          cd build/app/outputs/apk/release
          for f in app-*-release.apk; do
            abi=${f#app-}
            mv "$f" "shaarli_android-${VERSION}-${abi%-release.apk}.apk"
          done
          ls -l

      - name: Read app version
        id: version
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}')" >> $GITHUB_OUTPUT

      # Release notes: the CHANGELOG.md section for the current version,
      # falling back to a commit reference when no section exists yet.
      - name: Extract release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES=$(awk -v ver="$VERSION" 'index($0, "## [" ver "]")==1 {flag=1; next} /^## \[/ {flag=0} flag' CHANGELOG.md)
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="Automated release for commit ${{ github.sha }}."
          fi
          printf '%s\n' "$NOTES" > release_notes.md

      - name: Create Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/apk/release/shaarli_android-*.apk
          tag_name: v${{ steps.version.outputs.version }}
          name: "Shaarli Android v${{ steps.version.outputs.version }}"
          body_path: release_notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
